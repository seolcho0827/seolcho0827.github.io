<!DOCTYPE html>
<html data-theme="dark" lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' https:; img-src 'self' data: https:; media-src 'self' https:;">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>离线 | 小丫么小兔子的萝卜地儿</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Noto Sans SC", "PingFang SC", sans-serif;
    background: #130a1e;
    color: #e8dff0;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    -webkit-font-smoothing: antialiased;
  }
  .offline-box {
    max-width: 400px;
    padding: 40px 32px;
    background: rgba(30, 18, 50, 0.50);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(200, 170, 220, 0.20);
    border-radius: 20px;
    box-shadow: 0 16px 48px rgba(0, 0, 0, 0.40);
  }
  .offline-icon {
    font-size: 3rem;
    margin-bottom: 16px;
    opacity: 0.5;
  }
  h1 {
    font-size: 1.3rem;
    font-weight: 800;
    color: #f0e8ff;
    margin-bottom: 12px;
  }
  p {
    font-size: 0.9rem;
    color: #a080b8;
    line-height: 1.7;
    margin-bottom: 24px;
  }
  a {
    display: inline-block;
    padding: 12px 32px;
    font-size: 0.88rem;
    font-weight: 700;
    color: #fff;
    background: #c084fc;
    border-radius: 50px;
    text-decoration: none;
    transition: transform 0.3s, box-shadow 0.3s;
  }
  a:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 32px rgba(192, 132, 252, 0.20);
  }
</style>
</head>
<body>
  <div class="offline-box">
    <div class="offline-icon">&#x1F334;</div>
    <h1>网络连接已断开</h1>
    <p>看起来你暂时离线了，<br>有些回忆需要网络才能访问。</p>
    <a href="/">重新连接</a>
  </div>

<script>
(function(){
  var pv = document.getElementById('busuanzi_value_site_pv');
  if (pv) {
    var t = setTimeout(function() {
      if (pv.textContent === '0' || pv.textContent === '') pv.textContent = '--';
    }, 5000);
    var obs = new MutationObserver(function() {
      if (pv.textContent !== '0' && pv.textContent !== '' && pv.textContent !== '--') {
        clearTimeout(t); obs.disconnect();
      }
    });
    obs.observe(pv, { childList: true, characterData: true });
  }
})();
</script>

<script src="/scripts/glsl-shaders.js"></script>
<script src="/scripts/music-player.js"></script>
<script src="/scripts/pjax.js"></script>

</body>
</html>
